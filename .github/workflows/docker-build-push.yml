name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:

  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t dockerabhayraj/estatehub-backend:latest \
            ./EstateHub-Backend/EstateHub/EstateHub

      - name: Push Backend Image
        run: |
          docker push dockerabhayraj/estatehub-backend:latest


  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t dockerabhayraj/estatehub-frontend:latest \
            ./EstateHub-Frontend/EstateHub-Frontend

      - name: Push Frontend Image
        run: |
          docker push dockerabhayraj/estatehub-frontend:latest